<head>
	<!-- Version 1.0 -->
	<title>Screen Dominant</title>
	<meta description="Fills every LED with the single standout colour of your screen - the whole setup turns red on an Impostor reveal, gold in a sunset, blue in the ocean. Uses SignalRGB's screen analysis, so it costs nothing extra.">
	<meta publisher="Eshan">

	<meta property="satBoost" label="Saturation boost" type="number" min="0" max="100" default="35" tooltip="pushes the picked colour towards a pure colour"/>
	<meta property="brightness" label="Brightness" type="number" min="10" max="100" default="100"/>
	<meta property="smoothing" label="Smoothing" type="number" min="0" max="100" default="60" tooltip="0 = react instantly, 100 = drift very slowly between colours"/>
	<meta property="minSat" label="Ignore colours less saturated than" type="number" min="0" max="100" default="20" tooltip="greys and near-whites below this are not candidates"/>
	<meta property="followBrightness" label="Follow screen brightness" type="boolean" default="1" tooltip="dim screen = dim lights; off = always full colour"/>
	<meta property="darkScreen" label="When the screen is (almost) black" type="combobox" values="Dim,Keep last colour,Off" default="Dim"/>
</head>

<body style="margin: 0; padding: 0;">
	<canvas id="exCanvas" width="320" height="200"></canvas>
</body>

<script>
const canvas = document.getElementById("exCanvas");
const ctx = canvas.getContext("2d");
const WIDTH = 320, HEIGHT = 200;
const ZONES = 560;               // SignalRGB analyses the screen as 28 x 20 cells
const BINS = 36;                 // 10 degree hue bins

let curHue = null, curSat = 0, curLight = 0;   // smoothed output colour

// The standout colour of the screen from the per-cell hue/saturation/lightness arrays.
// Returns null when nothing colourful is on screen.
function pickDominant(hue, sat, light, minSat)
{
	const binWeight = new Float32Array(BINS);
	const binX = new Float32Array(BINS), binY = new Float32Array(BINS);   // hue vectors for a proper circular mean
	const binSat = new Float32Array(BINS), binLight = new Float32Array(BINS);
	let bright = 0;

	for(let i = 0; i < ZONES; i++)
	{
		const l = light[i], s = sat[i];

		if(l > 12)
		{bright++;}

		if(l < 8 || s < minSat || l > 96)
		{continue;}                                       // black, grey or white: not a colour

		// saturated, mid-lightness cells count most; very dark or very light ones little
		const w = (s / 100) * (1 - Math.abs(l - 50) / 50 * 0.6);
		const b = Math.floor(((hue[i] % 360) + 360) % 360 / (360 / BINS)) % BINS;
		const rad = hue[i] * Math.PI / 180;
		binWeight[b] += w;
		binX[b] += Math.cos(rad) * w;
		binY[b] += Math.sin(rad) * w;
		binSat[b] += s * w;
		binLight[b] += l * w;
	}

	// best bin including its neighbours, so a colour straddling a bin edge still wins
	let best = -1, bestScore = 0;

	for(let b = 0; b < BINS; b++)
	{
		const score = binWeight[b] + 0.5 * (binWeight[(b + 1) % BINS] + binWeight[(b + BINS - 1) % BINS]);

		if(score > bestScore)
		{bestScore = score; best = b;}
	}

	if(best < 0 || bestScore < 0.5)                      // less than half a cell's worth of colour
	{return {hue: null, bright: bright / ZONES};}

	let x = 0, y = 0, s = 0, l = 0, w = 0;

	for(const b of [best, (best + 1) % BINS, (best + BINS - 1) % BINS])
	{
		x += binX[b]; y += binY[b]; s += binSat[b]; l += binLight[b]; w += binWeight[b];
	}

	let h = Math.atan2(y, x) * 180 / Math.PI;

	if(h < 0)
	{h += 360;}

	return {hue: h, sat: s / w, light: l / w, weight: bestScore / ZONES, bright: bright / ZONES};
}

function lerpHue(a, b, t)
{
	let d = b - a;

	if(d > 180) {d -= 360;}
	if(d < -180) {d += 360;}

	return (a + d * t + 360) % 360;
}

function update()
{
	const hue = new Int16Array(engine.zone.hue);
	const sat = new Int8Array(engine.zone.saturation);
	const light = new Int8Array(engine.zone.lightness);

	const pick = pickDominant(hue, sat, light, minSat);
	const alpha = Math.max(0.02, 1 - smoothing / 100);   // per-frame blend towards the new colour

	let targetLight;

	if(pick.hue === null)
	{
		// nothing colourful on screen
		if(darkScreen === "Off")
		{targetLight = 0;}
		else if(darkScreen === "Keep last colour")
		{targetLight = curLight;}
		else
		{targetLight = 12 * Math.min(1, pick.bright * 4);}   // Dim: a faint glow scaled by how much is lit

		curLight += (targetLight - curLight) * alpha;
	}
	else
	{
		const targetSat = Math.min(100, pick.sat + satBoost);
		targetLight = followBrightness ? Math.max(22, Math.min(55, pick.light)) : 50;

		curHue = curHue === null ? pick.hue : lerpHue(curHue, pick.hue, alpha);
		curSat += (targetSat - curSat) * alpha;
		curLight += (targetLight - curLight) * alpha;
	}

	const l = curLight * brightness / 100;
	ctx.fillStyle = curHue === null ? "#000000" : `hsl(${curHue.toFixed(1)}, ${curSat.toFixed(1)}%, ${l.toFixed(1)}%)`;
	ctx.fillRect(0, 0, WIDTH, HEIGHT);

	window.requestAnimationFrame(update);
}

window.requestAnimationFrame(update);
</script>
